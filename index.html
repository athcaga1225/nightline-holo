<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta name="nightline-version" content="mock-avatar-angle-12">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>NIGHTLINE // HOLO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
/*
VOICE   安靜、俐落的遊戲內私訊終端，資訊密度高但不吵
IDEA    夜城的全像訊息介面：靠左的單一終端，右側留給城市的黑
PICTURE 對話本身：細線切角訊息框、紅色識別卡、紅色捲軸線
COLOUR  紅黑漸層底；暗紅線條與提示；NPC 青藍、V 薄荷綠
TYPE    Noto Sans TC 500 內文；Rajdhani 只用在英文系統小字
LAYOUT  桌機靠左約四成寬；面板按需開啟；手機全寬，輸入區貼底
*/
:root{
  color-scheme:dark;
  --header-cyan:#76d7e0;--red:#d9464e;--red-d:rgba(217,70,78,.55);--red-f:rgba(217,70,78,.16);
  --npc:#58c2c0;--npc-t:#e4f2f0;--npc-bg:rgba(70,160,160,.12);
  --v:#6fdfa7;--v-t:#a9f1cc;--v-bg:rgba(80,190,135,.11);
  --mute:rgba(232,205,205,.5);--ink:#ecdede;
  --e-n:#488b98;--f-n:#102126;--t-n:#76d7e0;--e-v:#4e997e;--f-v:#132d26;--t-v:#78dfb8;
  --gut:84px;--app-h:100dvh;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(90% 70% at 78% 8%,rgba(120,22,30,.55),transparent 60%),
    radial-gradient(70% 60% at 10% 100%,rgba(70,10,14,.6),transparent 70%),
    linear-gradient(170deg,#2b080b 0%,#1a0507 48%,#0b0203 100%);
  color:var(--ink);font:500 15.5px/1.55 "Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}
button:focus-visible{outline:1px solid var(--npc);outline-offset:2px}
textarea,textarea:focus,textarea:focus-visible{outline:none;box-shadow:none}
*{-webkit-tap-highlight-color:transparent}
.en{font-family:Rajdhani,"Noto Sans TC",sans-serif;font-weight:600;letter-spacing:.04em}

.stage{height:var(--app-h);display:flex;align-items:stretch;gap:32px;
  padding:clamp(24px,8vh,84px) 0 clamp(14px,3.5vh,36px) clamp(12px,4.5vw,92px)}
.term{width:clamp(500px,40vw,660px);display:flex;flex-direction:column;min-height:0}

/* ---------- 標題列 ---------- */
.head{display:grid;grid-template-columns:calc(var(--gut) + 10px) minmax(0,1fr);align-items:end}
.idslot{position:relative;height:92px;display:flex;align-items:flex-end;gap:10px;padding-bottom:2px}
.phone{width:14px;color:var(--header-cyan);opacity:.75;margin-bottom:14px;flex:none}
.idc{position:relative;width:50px;height:76px;flex:none;transform:perspective(260px) rotateY(20deg);transform-origin:left center}

.idc b{position:absolute;inset:0;border:1px solid var(--red);background:linear-gradient(160deg,rgba(217,70,78,.62),rgba(140,30,38,.42));
  display:grid;place-items:center;font-size:22px;font-weight:700;color:#ffe3e3;line-height:1}
.idc>.card-layer{position:absolute;inset:0;pointer-events:none;filter:none}
.idc>.layer-25{transform:translate(9px,-12px);opacity:.25;z-index:1}
.idc>.layer-50{transform:translate(6px,-8px);opacity:.5;z-index:2}
.idc>.layer-75{transform:translate(3px,-4px);opacity:.75;z-index:3}
.idc>.card-front{opacity:1;z-index:4;filter:none}
.idc.judy-card{transform:perspective(400px) rotateY(-7deg) skewY(4deg)}
.head .idc{transform:perspective(300px) rotateY(30deg) skewY(12deg);transform-origin:left center}


.judy-card b{border-color:#b14b51;background:linear-gradient(155deg,#80343a,#42171d 65%,#63242a);box-shadow:inset 0 0 0 2px #3b171b}
.judy-card b::before{inset:3px 3px auto;width:auto;height:3px;background:#c85559;opacity:.65}
.judy-avatar{display:block;width:calc(100% - 4px);aspect-ratio:1;object-fit:contain}


.idc b::after{content:attr(data-code);position:absolute;left:4px;bottom:3px;font:600 8px/1 Rajdhani,sans-serif;letter-spacing:.06em;color:rgba(255,220,220,.7)}
.idc b::before{content:"";position:absolute;right:4px;top:5px;width:10px;height:14px;
  background:repeating-linear-gradient(0deg,rgba(255,225,225,.55) 0 1px,transparent 1px 3px)}
.tw{padding-bottom:0}
.sys{display:flex;gap:12px;align-items:baseline;font-size:10px;color:rgba(217,70,78,.45);margin:0 0 4px 2px;white-space:nowrap;overflow:hidden}
.sys .st{color:var(--mute)}
.sys .st.on{color:var(--npc)}
/* 標題列：訊息、角色名的青線與紅線底部對齊同一條基準線 */
.trow{display:flex;align-items:flex-end;--tline:2px}
.tab{display:flex;align-items:center;gap:6px;padding:0 4px 4px 2px;border-bottom:var(--tline) solid var(--header-cyan);font-size:21px;font-weight:400;line-height:1.3;color:var(--header-cyan);white-space:nowrap;flex:none}
.tab svg{width:17px;height:12px;color:inherit}
.sep{color:var(--header-cyan);font-size:15px;line-height:1.3;padding:0 0 calc(var(--tline) + 6px);width:20px;text-align:center;flex:none}
.who{position:relative;display:flex;align-items:center;gap:6px;padding:0 4px 4px 2px;border-bottom:var(--tline) solid var(--header-cyan);font-size:21px;font-weight:400;line-height:1.3;color:var(--header-cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.who:hover,.who:focus-visible{color:var(--header-cyan)}
.udot{width:6px;height:6px;background:var(--red);border-radius:50%;flex:none}
.redl{flex:1;position:relative;height:1px;background:rgba(217,70,78,.75);margin:0 0 0 6px;min-width:30px}
.redl span{position:absolute;right:0;bottom:5px;font-size:9px;color:rgba(217,70,78,.45);white-space:nowrap}

/* ---------- 對話區 ---------- */
.body{flex:1;min-height:0;display:grid;grid-template-columns:var(--gut) minmax(0,1fr);margin-top:18px}
.logwrap{position:relative;min-height:0;display:flex;flex-direction:column}
.log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 18px 6px;
  border-right:1px solid var(--red-f);scrollbar-width:thin;scrollbar-color:var(--red) transparent}
.log::-webkit-scrollbar{width:3px}
.log::-webkit-scrollbar-thumb{background:var(--red)}
.log::-webkit-scrollbar-track{background:transparent}
.botl{height:1px;background:var(--red-d);flex:none}

.day{display:flex;align-items:center;gap:10px;margin:18px 0 14px;font-size:11px;color:var(--red-d)}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--red-f)}
.day:first-child{margin-top:6px}
.grp{display:flex;flex-direction:column;align-items:flex-start}
.grp.v{align-items:flex-end}
.grp+.grp{margin-top:14px}
.grp.join{margin-top:6px}
.bub{position:relative;max-width:min(86%,34em);padding:3px 12px 8px 9px;color:var(--t-n);font-size:16px;line-height:1.5;margin-top:6px}
.bub:first-child{margin-top:0}
.v .bub{color:var(--t-v);padding:3px 9px 8px 12px}
.bub svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.bub .tx{position:relative;display:block;white-space:pre-wrap;overflow-wrap:anywhere}
.stamp{font:11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;color:#6a8f93;margin:5px 1px 0;white-space:nowrap}
.choices{display:flex;flex-direction:column;align-items:flex-end;gap:7px;margin-top:16px;padding-right:0}
.opt{position:relative;max-width:min(92%,34em);padding:3px 12px 8px 9px;text-align:left;font-size:16px;line-height:1.5;color:rgba(120,223,184,.62);background:none}
.opt svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.opt svg path{stroke:rgba(78,153,126,.55);fill:transparent;transition:fill .12s,stroke .12s}
.opt .tx{position:relative;display:block;white-space:pre-wrap;overflow-wrap:anywhere}
.opt:hover,.opt:focus-visible{color:var(--t-v);outline:none}
.opt:hover svg path,.opt:focus-visible svg path{stroke:#6fcfae;fill:rgba(36,98,80,.45)}
.sbar{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 10px;padding:8px 10px;border-left:2px solid var(--red);background:rgba(217,70,78,.1);font-size:13px;color:#f1d4d4}
.sbar[hidden]{display:none}
.sbar .msg{flex:1 1 220px}.sbar .msg b{color:var(--red);font-weight:700;margin-right:8px}
.sbar .btn{height:30px;padding:0 12px;font-size:13px}
.sbar.ok{border-left-color:var(--npc);background:rgba(88,194,192,.08);color:#cfe4e2}
.stamp .bad{margin-left:6px;color:var(--red)}
.day.more::before,.day.more::after{display:none}.day.more{justify-content:center;color:var(--mute)}
.dbnote{margin:6px 0 0;color:var(--mute)}
.pf .note2{margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--mute);font-weight:400}
.sysm{margin:14px 0;text-align:center;font-size:12px;color:var(--red)}
.dots{position:relative;display:flex;gap:4px;padding:6px 2px 3px}
.dots i{width:5px;height:5px;background:var(--t-n);opacity:.3;animation:bl 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes bl{40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.jump{position:absolute;right:16px;bottom:12px;display:none;align-items:center;gap:6px;height:32px;padding:0 12px;
  font-size:13px;color:#06140f;background:var(--npc);clip-path:polygon(0 0,100% 0,100% 70%,calc(100% - 9px) 100%,0 100%)}
.jump.on{display:flex}

/* ---------- 輸入區 ---------- */
.comp{display:grid;grid-template-columns:var(--gut) minmax(0,1fr);padding-top:12px;flex:none}
.comp>.box{grid-column:2}
.box{position:relative;display:flex;align-items:flex-end;gap:10px;padding:7px 8px 12px 13px;min-height:48px}
.box>svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.box>svg path{stroke:rgba(78,153,126,.42);fill:rgba(8,18,17,.55);transition:stroke .15s,fill .15s}
.box:hover>svg path{stroke:rgba(78,153,126,.65)}
.box.f>svg path{stroke:#5fae93;fill:rgba(19,45,38,.8)}
textarea{position:relative;flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--v-t);
  font:500 16px/1.5 "Noto Sans TC",sans-serif;padding:4px 0;height:32px;max-height:132px;overflow-y:auto;scrollbar-width:thin}
textarea::placeholder{color:rgba(120,223,184,.32)}
.send{position:relative;flex:none;height:34px;padding:0 2px 0 4px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--red);background:none}
.send .k{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#bfe9ea;color:#0b1a1c;transition:background .15s}
.send .k svg{width:11px;height:11px;margin-left:2px}
.send:disabled{color:var(--mute);cursor:default}
.send:disabled .k{background:rgba(191,233,234,.2);color:#cfe4e2}
.send:not(:disabled):hover .k{background:#fff}
.hints{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:10px;font-size:13px}
.hint{display:flex;align-items:center;gap:7px;color:var(--red);min-height:28px;white-space:nowrap}
.hint.static{color:var(--mute)}
.key{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#bfe9ea;color:#0b1a1c;font:600 12px/1 Rajdhani,sans-serif}
.hint.static .key{background:rgba(191,233,234,.22);color:#cfe4e2}
.note{margin-left:auto;font-size:11px;color:var(--mute);opacity:.8}

/* ---------- 面板 ---------- */
.sheet{display:none;flex-direction:column;width:330px;align-self:flex-start;margin-top:110px;max-height:calc(100% - 110px);
  background:rgba(22,6,8,.9);border:1px solid var(--red-d);clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.sheet.open{display:flex}
.sh-h{display:flex;align-items:center;border-bottom:1px solid var(--red-f);padding:0 6px 0 14px}
.sh-t{height:44px;padding:0 10px;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.sh-t[aria-selected=true]{color:#cfe4e2;border-color:var(--npc)}
.x{margin-left:auto;width:40px;height:40px;font-size:20px;color:var(--red)}
.sh-b{overflow-y:auto;padding:10px 14px 16px;scrollbar-width:thin;scrollbar-color:var(--red) transparent}
.ct{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:10px 8px;border-left:2px solid transparent}
.ct+.ct{border-top:1px solid var(--red-f)}
.ct[aria-current=true]{border-left-color:var(--npc);background:rgba(88,194,192,.06)}
.ct:hover{background:rgba(217,70,78,.07)}
.ct .idc{grid-row:span 2;width:30px;height:44px;margin-left:6px}
.ct .idc b{font-size:14px}.ct .idc b::after,.ct .idc b::before{display:none}
.ct .nm{font-size:15px;color:#e2ecea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .tm{font-size:11px;color:var(--mute);text-align:right}
.ct .pv{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.ct .ub{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:600 11px/18px Rajdhani,sans-serif;text-align:center}
.pf h2{margin:6px 0 0;font-size:20px;font-weight:700;color:#e8f1ef}
.pf .enn{font-size:12px;color:var(--red-d);margin-top:2px}
.pf dl{margin:14px 0 0;display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:9px 10px;font-size:14px}
.pf dt{color:var(--red);font-weight:500}
.pf dd{margin:0;color:#d9e6e4;font-weight:400;line-height:1.6}
.pf h3{font-size:12px;font-weight:500;color:var(--mute);margin:18px 0 0;padding-top:12px;border-top:1px solid var(--red-f)}
.pf .act{margin-top:16px;display:flex;gap:10px}
.seg{display:flex;margin:0 0 8px}
.seg button{height:32px;padding:0 14px;font-size:13px;border:1px solid var(--red-d);color:var(--mute)}
.seg button+button{border-left:0}
.seg button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.btn{height:36px;padding:0 14px;font-size:14px;border:1px solid var(--red-d);color:var(--red)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red)}
.pf .fan{margin-top:16px;font-size:12px;line-height:1.6;color:var(--mute);font-weight:400}
.scrim{display:none}

/* ---------- 確認 ---------- */
.dlg{position:fixed;inset:0;display:none;place-items:center;background:rgba(8,2,3,.6);z-index:30;padding:20px}
.dlg.open{display:grid}
.dlg .card{width:min(380px,100%);background:#1d0709;border:1px solid var(--red);padding:18px 18px 16px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.dlg h3{margin:0 0 8px;font-size:17px;color:#f1dede}
.dlg p{margin:0;font-size:14px;color:var(--mute);font-weight:400}
.dlg .act{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ---------- 響應 ---------- */
@media (max-width:1100px){
  .term{width:min(640px,66vw)}
  .sheet{position:fixed;right:0;top:0;bottom:0;margin:0;max-height:none;width:min(360px,100%);z-index:20;clip-path:none;border-width:0 0 0 1px}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(6,1,2,.5);z-index:19}
}
@media (max-width:720px){
  :root{--gut:0px}
  body{font-size:16px}
  .stage{padding:0;gap:0}
  .term{width:100%;padding:max(10px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom))}
  .head{grid-template-columns:74px minmax(0,1fr)}
  .idslot{height:58px;gap:8px}.phone{display:block;width:13px}
  .idc{width:32px;height:48px}.head .idc b{font-size:15px}.head .idc b::before{display:none}
  .tab{font-size:18px}.who{font-size:18px}.sep{width:16px}
  .redl{min-width:8px}
  .redl span{display:none}
  #sysId{display:none}.sys{gap:8px}
  .body{margin-top:12px}
  .log{padding:4px 10px 14px 2px}
  .bub{max-width:86%}
  .hints{gap:4px 14px}.hint.static{display:none}.note{font-size:10px}
  .sheet{width:100%;border:0}
}
@media(max-width:360px){.tab,.who{font-size:16px}.tab{gap:4px}.sep{width:12px}.redl{margin-left:4px}}
#dbg{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);overflow:auto;z-index:40;background:rgba(12,4,6,.96);border-left:1px solid var(--red-d);padding:14px 16px 30px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#d8e4e2}
#dbg h2{margin:0 0 8px;font:600 15px/1.3 "Noto Sans TC",sans-serif;color:var(--red)}#dbg h2 small{color:var(--mute);font-weight:400}
#dbg h3{margin:14px 0 6px;font:600 13px/1.3 "Noto Sans TC",sans-serif;color:#b9e0e1}
#dbg dl{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:3px 8px;margin:0}#dbg dt{color:var(--mute)}#dbg dd{margin:0}
#dbg .dbtn{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}#dbg button,#dbg select,#dbg input{font:inherit;color:#d8e4e2;background:#1d0a0d;border:1px solid var(--red-d);padding:4px 8px;min-height:30px}
#dbg .dbev{margin:0;padding-left:1.2em}#dbg .dbev span{color:var(--mute)}#dbg pre{white-space:pre-wrap;word-break:break-all;margin:0;color:#9fd6d6;font-size:12px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <main class="term" aria-label="NIGHTLINE 私訊終端">
    <header class="head">
      <div class="idslot">
        <svg class="phone" viewBox="0 0 18 34" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true">
          <path d="M3.5 8.5h9v22h-9z" fill="currentColor" fill-opacity=".13"/>
          <path d="M5 8.5V5.7h2.5v2.8M5 28.6h6"/>
          <rect x="5" y="11" width="6" height="10.5" fill="#102126"/>
          <path d="M3.5 22h9v8.5h-9z" fill="currentColor" stroke="none"/>
          <path d="M5 24.5h1M7.5 24.5h1M10 24.5h1M5 27h1M7.5 27h1M10 27h1" stroke="#102126" stroke-width="1.2"/>
          <path d="M10 5.8c1.8 0 3.2 1.1 3.5 2.6M10.6 3.3c2.9 0 5.1 1.9 5.5 4.5M11.3 1c3.6.2 5.7 2.7 6 5.5" stroke-linecap="round"/>
        </svg>
        <div id="idcard"></div>
      </div>
      <div class="tw">
        <div class="sys en"><span id="sysId">NL_HOLO_TRN</span><span id="sysEn"></span><span class="st" id="sysSt">LINK OK</span></div>
        <div class="trow">
          <div class="tab"><svg viewBox="0 0 17 12" aria-hidden="true"><rect width="17" height="12" fill="currentColor"/><path d="M.8.8l7.7 6 7.7-6" fill="none" stroke="#1a0507" stroke-width="1.4"/></svg><span>訊息</span></div>
          <span class="sep" aria-hidden="true">›</span>
          <button class="who" id="who" aria-haspopup="dialog" title="切換聯絡人"><span id="whoName"></span></button>
          <div class="redl" aria-hidden="true"><span class="en">VER_NL20.77</span></div>
        </div>
      </div>
    </header>

    <div class="body">
      <div></div>
      <div class="logwrap">
        <div class="log" id="log" role="log" aria-live="polite" aria-label="對話紀錄"></div>
        <button class="jump" id="jump"><span id="jumpTx">回到最新訊息</span> ↓</button>
        <div class="botl"></div>
      </div>
    </div>

    <div class="comp">

/* ============================================================
   2. 儲存層（ChatStore）
   介面只透過下列方法存取資料。之後改接 Supabase 等雲端資料庫，
   只要提供同名、同回傳格式的實作，再把 createStore() 換掉即可。

   open()                              開啟資料庫
   getMeta(key) / putMeta(key, value)  系統資料（目前聊天室、遷移紀錄）
   getSettings(id) / putSettings(rec)  每位 NPC 的設定：草稿、未讀、關係、待選回覆
   addMessages(id, msgs)               新增訊息；seq 在該 NPC 內遞增，回傳附 seq 的訊息
   latest(id, n) / before(id, seq, n)  分頁讀取（由舊到新排序）
   count(id) / dumpContact(id)         筆數／全部訊息（匯出用）
   clearContact(id, settings)          清除該 NPC 的訊息與 AI 資料，寫入新的設定
   patchMessages(id, [{seq, text}])    修改指定訊息的文字（只用於更新預設開場台詞）
   mergeContacts(plan)                 單一交易合併多位 NPC 的訊息與設定，重複的略過；
                                       任何一步失敗就整筆不寫入（遷移、匯入用）
   getSummary(id) / putSummary(id, s)  歷史摘要（預留給 AI，現在不寫入）
   listMemories(id) / putMemory(id, m) 長期記憶（預留給 AI，現在不寫入）

   訊息格式：{ contactId, seq, from: "v" | "n" | "sys", text, t }
   每位 NPC 的訊息以 [contactId, seq] 為主鍵，各自占一段獨立的鍵範圍；
   清除、分頁、匯出都只作用在該 NPC 的範圍內。不設數量上限，也不會自動刪除。
   ============================================================ */
const DB_NAME=MOCK_TEST?"nightline-holo-demo-lines-"+sceneNumber:"nightline-holo",DB_VER=2;
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const txDone=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error||new Error("寫入失敗"));
  t.onabort=()=>rej(t.error||new DOMException("寫入已中止","AbortError"))});
const krange=id=>IDBKeyRange.bound([id],[id,[]]);            /* [id, 任何值] 的完整範圍 */
const msgKey=m=>m.from+"\u0001"+m.t+"\u0001"+m.text;          /* 判斷重複：同發話者、同時間、同內容 */
const MSG_EXTRA=["src","trigger","phase","genAt","eventAt"];   /* 主動訊息：來源、觸發事件、產生階段、實際產生時間、虛構事件時間 */
const cleanMsg=m=>{const o={from:m.from,text:m.text,t:m.t};for(const k of MSG_EXTRA)if(m[k]!=null)o[k]=m[k];return o};
function sortChrono(list){return list.map((m,i)=>[m,i]).sort((a,b)=>a[0].t-b[0].t||a[1]-b[1]).map(x=>x[0])}

function IndexedDBStore(){
  let db;
  const T=(names,mode="readonly")=>db.transaction(names,mode);
  const cursorList=(st,range,dir,n)=>new Promise((res,rej)=>{const out=[],r=st.openCursor(range,dir);
    r.onsuccess=()=>{const c=r.result;if(!c||out.length>=n)return res(out);out.push(c.value);c.continue()};r.onerror=()=>rej(r.error)});
  return {
    kind:"IndexedDB",
    async open(){
      if(!window.indexedDB)throw new Error("這個瀏覽器不支援 IndexedDB");
      db=await new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);
        r.onupgradeneeded=()=>{const d=r.result,has=n=>d.objectStoreNames.contains(n);
          if(!has("messages"))d.createObjectStore("messages",{keyPath:["contactId","seq"]});
          if(!has("settings"))d.createObjectStore("settings",{keyPath:"id"});
          if(!has("meta"))d.createObjectStore("meta",{keyPath:"key"});
          if(!has("summaries"))d.createObjectStore("summaries",{keyPath:"contactId"});
          if(!has("memories"))d.createObjectStore("memories",{keyPath:["contactId","id"]});
          /* v2：曾用於前端生活情境；現已改由私人後端管理，表保留以免資料庫降版，前端不再讀寫 */
          if(!has("life"))d.createObjectStore("life",{keyPath:["contactId","timeline"]});
          if(!has("events"))d.createObjectStore("events",{keyPath:["contactId","timeline","id"]})};
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
        r.onblocked=()=>rej(new Error("資料庫正被其他分頁使用，請關閉其他 NIGHTLINE 分頁後重新整理"))});
      db.onversionchange=()=>{db.close();this.onlost&&this.onlost(new Error("資料庫已在其他分頁更新，請重新整理"))};
      db.onclose=()=>{this.onlost&&this.onlost(new Error("瀏覽器關閉了資料庫連線，請重新整理"))};
    },
    async getMeta(k){const r=await reqP(T("meta").objectStore("meta").get(k));return r?r.value:undefined},
    async putMeta(k,v){const t=T("meta","readwrite");t.objectStore("meta").put({key:k,value:v});await txDone(t)},
    async getSettings(id){return (await reqP(T("settings").objectStore("settings").get(id)))||null},
    async putSettings(rec){const t=T("settings","readwrite");t.objectStore("settings").put(rec);await txDone(t)},
    async addMessages(id,msgs){
      const t=T("messages","readwrite"),st=t.objectStore("messages");
      const last=await cursorList(st,krange(id),"prev",1);let seq=last.length?last[0].seq:0;
      const out=msgs.map(m=>({contactId:id,seq:++seq,...cleanMsg(m)}));out.forEach(m=>st.add(m));
      await txDone(t);return out},
    async latest(id,n){return (await cursorList(T("messages").objectStore("messages"),krange(id),"prev",n)).reverse()},
    async before(id,seq,n){return (await cursorList(T("messages").objectStore("messages"),IDBKeyRange.bound([id],[id,seq],false,true),"prev",n)).reverse()},
    async count(id){return reqP(T("messages").objectStore("messages").count(krange(id)))},
    async dumpContact(id){return reqP(T("messages").objectStore("messages").getAll(krange(id)))},
    async clearContact(id,settings){
      const t=T(["messages","settings","summaries","memories"],"readwrite");
      t.objectStore("messages").delete(krange(id));t.objectStore("summaries").delete(id);
      t.objectStore("memories").delete(krange(id));t.objectStore("settings").put(settings);await txDone(t)},
    async mergeContacts(plan){
      const t=T(["messages","settings"],"readwrite"),st=t.objectStore("messages"),ss=t.objectStore("settings"),result=[];
      for(const p of plan){
        const existing=await reqP(st.getAll(krange(p.id))),seen=new Set(existing.map(msgKey)),fresh=[];let skipped=0;
        for(const m of p.messages){const k=msgKey(m);if(seen.has(k)){skipped++;continue}seen.add(k);fresh.push(cleanMsg(m))}
        if(fresh.length){
          /* 依時間重新排序後整段寫回，舊訊息插在正確位置 */
          const all=sortChrono([...existing.map(cleanMsg),...fresh]);
          st.delete(krange(p.id));all.forEach((m,i)=>st.add({contactId:p.id,seq:i+1,...m}));
        }
        if(p.settings)ss.put(p.settings);
        result.push({id:p.id,added:fresh.length,skipped,total:existing.length+fresh.length});
      }
      await txDone(t);return result},
    async patchMessages(id,patches){
      const t=T("messages","readwrite"),st=t.objectStore("messages");
      for(const p of patches){const m=await reqP(st.get([id,p.seq]));if(m)st.put({...m,text:p.text})}
      await txDone(t)},
    async getSummary(id){return (await reqP(T("summaries").objectStore("summaries").get(id)))||null},
    async putSummary(id,s){const t=T("summaries","readwrite");t.objectStore("summaries").put({...s,contactId:id});await txDone(t)},
    async listMemories(id){return reqP(T("memories").objectStore("memories").getAll(krange(id)))},
    async putMemory(id,m){const t=T("memories","readwrite");t.objectStore("memories").put({...m,contactId:id});await txDone(t)},
  };
}

/* IndexedDB 無法使用時的備援：同樣介面，只存在記憶體，關閉頁面就消失（會明確提示） */
function MemoryStore(){
  const meta=new Map(),settings=new Map(),msgs=new Map(),sums=new Map(),mems=new Map();
  const L=id=>{if(!msgs.has(id))msgs.set(id,[]);return msgs.get(id)};
  return {
    kind:"記憶體（不會保存）",async open(){},
    async getMeta(k){return meta.get(k)},async putMeta(k,v){meta.set(k,v)},
    async getSettings(id){return settings.get(id)||null},async putSettings(r){settings.set(r.id,{...r})},
    async addMessages(id,list){const a=L(id);let seq=a.length?a[a.length-1].seq:0;const out=list.map(m=>({contactId:id,seq:++seq,...cleanMsg(m)}));a.push(...out);return out},
    async latest(id,n){return L(id).slice(-n)},
    async before(id,seq,n){const a=L(id).filter(m=>m.seq<seq);return a.slice(-n)},
    async count(id){return L(id).length},async dumpContact(id){return L(id).slice()},
    async clearContact(id,s){msgs.set(id,[]);sums.delete(id);mems.delete(id);settings.set(id,{...s})},
    async mergeContacts(plan){return plan.map(p=>{const a=L(p.id),seen=new Set(a.map(msgKey)),fresh=[];let skipped=0;
      for(const m of p.messages){const k=msgKey(m);if(seen.has(k)){skipped++;continue}seen.add(k);fresh.push(cleanMsg(m))}
      const all=sortChrono([...a.map(cleanMsg),...fresh]);msgs.set(p.id,all.map((m,i)=>({contactId:p.id,seq:i+1,...m})));
      if(p.settings)settings.set(p.id,{...p.settings});return {id:p.id,added:fresh.length,skipped,total:all.length}})},
    async patchMessages(id,patches){for(const p of patches){const m=L(id).find(x=>x.seq===p.seq);if(m)m.text=p.text}},
    async getSummary(id){return sums.get(id)||null},async putSummary(id,s){sums.set(id,{...s,contactId:id})},
    async listMemories(id){return (mems.get(id)||[]).slice()},async putMemory(id,m){if(!mems.has(id))mems.set(id,[]);mems.get(id).push({...m,contactId:id})},
  };
}

/* ============================================================
   3. 舊版 localStorage 遷移
   - 舊資料只讀取、不修改也不刪除，另在 IndexedDB 備份一份原文。
   - 先寫入、再逐一核對筆數，全部吻合才標記完成；中途失敗下次開啟會重試，
     重複的訊息會被略過，不會寫兩次。
   ============================================================ */
const fixLegacyText=(id,m)=>id==="judy"&&m.id==="s1"&&m.from==="n"&&m.text==="我把上次那段超夢修好了，畫面乾淨很多"?{...m,text:"上次那段幻舞我修好了，畫面乾淨多了。"}:m;
const validMsg=m=>m&&["v","n","sys"].includes(m.from)&&typeof m.text==="string"&&Number.isFinite(m.t);
async function migrateLegacy(store){
  const done=await store.getMeta("migration.localStorage.v1");
  if(done&&done.status==="done")return {status:"already"};
  let raw=null;try{raw=localStorage.getItem(LEGACY_KEY)}catch(e){}
  if(!raw){await store.putMeta("migration.localStorage.v1",{status:"done",at:Date.now(),found:false});return {status:"none"}}
  let data;try{data=JSON.parse(raw)}catch(e){throw new Error("舊版紀錄格式無法讀取，原資料已保留在瀏覽器中，沒有任何變更")}
  await store.putMeta("legacy.localStorage.v1.raw",{savedAt:Date.now(),raw});
  const plan=[],expect={};
  for(const id of ORDER){
    const c=data&&data.c&&data.c[id];if(!c)continue;
    const list=normalizeSeeds(id,(Array.isArray(c.log)?c.log:[]).map(m=>fixLegacyText(id,m)).filter(validMsg));
    expect[id]=new Set(list.map(msgKey)).size;
    plan.push({id,messages:list,settings:{id,draft:typeof c.draft==="string"?c.draft:"",unread:Number(c.unread)||0,
      mode:c.mode==="friend"||c.mode==="lover"?c.mode:defaultMode(id),choices:Array.isArray(c.choices)?c.choices.map(String).slice(0,3):null,seeded:true}});
  }
  const result=await store.mergeContacts(plan);
  for(const id of Object.keys(expect)){const n=await store.count(id);
    if(n<expect[id])throw new Error(`遷移核對失敗：${C[id].short}應有 ${expect[id]} 則，只找到 ${n} 則。原資料仍保留，下次開啟會再試一次`)}
  if(data&&C[data.active])await store.putMeta("app",{active:data.active});
  await store.putMeta("migration.localStorage.v1",{status:"done",at:Date.now(),found:true,result});
  return {status:"migrated",result};
}

/* 開場台詞更新：只看最前面幾則，且第 i 則的文字要和舊預設的第 i 句完全相同才改；
   後來使用者自己打的同樣文字不會被動到。每個版本只跑一次。 */
const SEED_UPDATES=[{key:"seedText.judy.v2",id:"judy",
  old:["V，你還醒著嗎","上次那段幻舞我修好了，畫面乾淨多了。","醒著。修好就好，辛苦了","下次換你陪我測試，不准逃 ;)"]}];
const seedNew=id=>C[id].seed.map(x=>x[2]);
function normalizeSeeds(id,list){                    /* 遷移時先套用同樣轉換，重跑才比對得到重複 */
  const u=SEED_UPDATES.find(x=>x.id===id);if(!u)return list;const nw=seedNew(id);
  return list.map((m,i)=>i<u.old.length&&m.text===u.old[i]?{...m,text:nw[i]}:m);
}
async function applySeedUpdates(store){
  for(const u of SEED_UPDATES){
    if(await store.getMeta(u.key))continue;
    const nw=seedNew(u.id),first=(await store.dumpContact(u.id)).slice(0,u.old.length);
    const patches=first.map((m,i)=>m.text===u.old[i]?{seq:m.seq,text:nw[i]}:null).filter(Boolean);
    if(patches.length)await store.patchMessages(u.id,patches);
    await store.putMeta(u.key,{at:Date.now(),patched:patches.length});
  }
}

const judySleepReplies = {

/* 模擬模式專用：依關鍵字挑預設台詞，不重複上一句 */
function mockCompose(id,text,recent,mode){
  const lv=C[id].lover&&mode==="lover"?C[id].lover.pool:null,p=lv?{...C[id].pool,...lv}:C[id].pool,lastNpc=[...recent].reverse().find(m=>m.role==="assistant");
  if(id==="judy" && mode==="lover"){
    if(lastNpc?.text==="你是為了哪件事道歉？"){
      if(/口氣/.test(text))return {messages:["剛剛那句是有點刺。","你在氣什麼？跟我說，別拿我當靶子。"],k:"sorryReason"};
      if(/等/.test(text))return {messages:["我有在等，也有點擔心。","下次晚到先傳一聲。你現在到哪了？"],k:"sorryReason"};
      if(/開口/.test(text))return {messages:["那就慢慢講，我在。","不用先替我決定我會不會生氣。"],k:"sorryReason"};
      return {messages:[`你說「${text}」。我有在聽。`,"這件事是什麼時候發生的？"],k:"sorryReason"};
    }
    if(/^(?:對不起|抱歉|不好意思)[。！!…]*$/.test(text.trim()))return {messages:["你是為了哪件事道歉？"],k:"sorryClarify"};
    if(/^(?:你)?\s*(?:今天|明天)?\s*(?:是)?(?:幾點(?:要|才)?上班|上班是?幾點|幾點開工)(?:嗎|啊|呀|呢)?[？?。]?$/u.test(text.trim())){
      return {messages:["晚點才會出發，你是想過來找我嗎？"],k:"workHours"};
    }
    if(/^\s*(?:我)?來報到了?[。！!]?\s*(?:;\))?\s*$/.test(text)){
      return {messages:["好，算你有到。","今天怎麼這麼乖？"],k:"checkIn"};
    }
    if(/^\s*(?:你|妳)?\s*(?:昨晚|昨天)?\s*睡得(?:比較)?好嗎[？?。]?\s*$/.test(text)){
      return {messages:[judySleepReplies.slept],k:"sleep"};
    }
    if([judySleepReplies.slept,"有。醒來才發現我把鬧鐘按掉三次。"].includes(lastNpc?.text) && /^\s*(?:你|妳)?\s*(?:居然|竟然)?\s*有設鬧鐘[？?。！!]?\s*$/.test(text)){
      return {messages:judySleepReplies.alarm.slice(),k:"sleep"};
    }
  }
  const rules=[
    ["bye",/晚安|睡了|掰|拜拜|先這樣|下次聊|先下線/],
    ["love",/愛你|想你|喜歡你|抱抱|親親/],
    ["sorry",/對不起|抱歉|不好意思|sorry/i],
    ["thx",/謝|感恩|多謝/],
    ["praise",/好棒|厲害|可愛|漂亮|好讚|佩服|超強/],
    ["worry",/受傷|流血|打架|危險|中槍|開槍|出事|醫院/],
    ["tired",/累|睏|好煩|撐不住/],
    ["dayOff",/^(?:你)?(?:下次|下回)?(?:放假|休假)(?:想|要)(?:去哪(?:裡)?|做什麼)[？?。]?$/],
    ["work",/幻舞|剪片|工作|案子|編輯|渲染/],
    ["greet",/^\s*(嗨|哈囉|安安|早安?|在嗎|在不在|hi|hey|hello)/i],
    ["q",/[?？]|嗎|呢$|怎麼|為什麼|要不要/]];
  const hit=rules.find(([k,re])=>p[k]&&re.test(text)),k=hit?hit[0]:"any";
  const first=v=>Array.isArray(v)?v[0]:v,avoid=lastNpc&&lastNpc.text;
  let x;for(let i=0;i<6;i++){x=p[k][Math.floor(R()*p[k].length)];if(first(x)!==avoid)break}
  if(Array.isArray(x))return {messages:x.slice(),k};
  const out=[x];
  if(!(id==="judy" && mode==="lover") && R()<.3){const y=p.any.filter(v=>!Array.isArray(v)&&v!==x);if(y.length)out.push(y[Math.floor(R()*y.length)])}
  return {messages:out,k};
}

/* ---- 儲存錯誤：顯示在輸入框上方，必須處理（重試或匯出）才會消失 ---- */
const failures=[];let fatalErr=null;
function why(e){if(!e)return"未知錯誤";if(e.name==="QuotaExceededError")return"裝置的儲存空間不足";return e.message||e.name||String(e)}
function fail(key,label,err,retry){const i=failures.findIndex(f=>f.key===key);const f={key,label,err,retry};
  if(i>=0)failures[i]=f;else failures.push(f);console.error("[NIGHTLINE] 儲存失敗："+label,err);renderSbar()}
function renderSbar(note,noteErr){
  const b=$("sbar");
  if(fatalErr){b.hidden=false;b.className="sbar";b.innerHTML=`<span class="msg"><b>無法保存紀錄</b>${esc(why(fatalErr))}。這次的對話只會留在畫面上，關閉後就會消失；需要的話請先匯出。</span><button class="btn" data-act="export">匯出紀錄</button>`;return}
  if(failures.length){const f=failures[failures.length-1];b.hidden=false;b.className="sbar";
    b.innerHTML=`<span class="msg"><b>儲存失敗</b>${failures.length>1?`有 ${failures.length} 項資料沒有成功存取`:esc(f.label)}（${esc(why(f.err))}）</span><button class="btn pri" data-act="retry">重試</button><button class="btn" data-act="export">匯出紀錄</button>`;return}
  if(note){b.hidden=false;b.className=noteErr?"sbar":"sbar ok";b.innerHTML=`<span class="msg">${esc(note)}</span>`;clearTimeout(renderSbar.t);renderSbar.t=setTimeout(()=>{if(!failures.length&&!fatalErr)b.hidden=true},noteErr?8000:4000);return}
  b.hidden=true;b.innerHTML="";
}
async function retryAll(){const list=failures.splice(0);renderSbar();let bad=0;
  for(const f of list){try{await f.retry()}catch(e){bad++;fail(f.key,f.label,e,f.retry)}}
  if(!bad)renderSbar("已重新儲存");}

function renderLog(){
  const id=app.active,W=win[id],L=W.msgs;let h="",prev=null,grp=[];
  if(W.hasMore)h+=`<div class="day more">${W.loading?"載入更早的訊息…":"往上捲動載入更早的訊息"}</div>`;
  const flush=()=>{if(!grp.length)return;const f=grp[0].from,bad=grp.some(m=>m.failed);
    h+=`<div class="grp ${f==="v"?"v":"n"}">`+grp.map(m=>bub(f==="v"?"v":"n",`<span class="tx">${esc(m.text)}</span>`)).join("")
      +`<div class="stamp en">${hm(grp[grp.length-1].t)}${bad?`<span class="bad">未儲存</span>`:""}</div></div>`;grp=[]};
  L.forEach(m=>{
    if(m.from==="sys"){flush();h+=`<div class="sysm" role="status">${esc(m.text)}</div>`;prev=m;return}
    if(!prev||dayKey(prev.t)!==dayKey(m.t)){flush();h+=`<div class="day">${dayLabel(m.t)}</div>`}
    else if(prev.from!==m.from||m.t-prev.t>6*60000)flush();
    grp.push(m);prev=m});
  flush();
  if(typing[id]){const join=prev&&prev.from==="n";
    h+=`<div class="grp n${join?" join":""}">`+bub("n",`<span class="dots"><i></i><i></i><i></i></span><span class="sr">${esc(C[id].short)} 輸入中</span>`)+`</div>`}
  const ch=!typing[id]&&set[id].choices;
  if(ch&&ch.length)h+=`<div class="choices" role="group" aria-label="快速回覆">`+
    ch.map((t,i)=>`<button class="opt" data-k="v" data-i="${i}"><svg aria-hidden="true"><path stroke-width="1" stroke-linejoin="miter" shape-rendering="geometricPrecision"/></svg><span class="tx">${esc(t)}</span></button>`).join("")+`</div>`;
  ro.disconnect();log.innerHTML=h;log.querySelectorAll(".bub,.opt").forEach(b=>{draw(b);ro.observe(b)});
}
function renderHead(){

  $("whoName").textContent=c.name;
  const w=$("who");w.querySelector(".udot")?.remove();
  if(others)w.insertAdjacentHTML("beforeend",'<span class="udot" title="其他聯絡人有新訊息"></span>');
  $("sysEn").textContent=c.en+" · "+c.code;
  const st=$("sysSt");st.textContent=typing[app.active]?"輸入中…":"LINK OK · "+replyProvider.label;st.classList.toggle("on",!!typing[app.active]);

}

/* ---- 捲動 ---- */
const nearBottom=()=>log.scrollHeight-log.scrollTop-log.clientHeight<56;
const toBottom=()=>{log.scrollTop=log.scrollHeight;newCount=0;updJump()};
function updJump(){const j=$("jump"),far=log.scrollHeight-log.scrollTop-log.clientHeight>240;
  j.classList.toggle("on",newCount>0||far);$("jumpTx").textContent=newCount?`${newCount} 則新訊息`:"回到最新訊息"}
/* 停在最底時，版面變矮（手機鍵盤展開、視窗縮放）仍黏在最新訊息；往上讀時不動 */
let stick=true;
log.addEventListener("scroll",()=>{stick=nearBottom();if(stick)newCount=0;updJump();if(log.scrollTop<160)loadOlder()},{passive:true});
const roLog=new ResizeObserver(()=>{if(stick)log.scrollTop=log.scrollHeight});roLog.observe(log);
$("jump").onclick=()=>log.scrollTo({top:log.scrollHeight,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
function refresh(isMsg){const near=nearBottom(),top=log.scrollTop;renderLog();renderHead();
  if(near)toBottom();else{log.scrollTop=top;if(isMsg)newCount++;updJump()}}

/* ---- 分頁載入 ---- */
async function openRoom(id){
  const W=win[id];if(W.loaded)return;
  try{const rows=await store.latest(id,PAGE);W.msgs=rows;W.hasMore=rows.length===PAGE&&(await store.count(id))>PAGE;W.loaded=true}
  catch(e){W.loaded=false;fail("read:"+id,`${C[id].short}的紀錄讀取失敗`,e,()=>openRoom(id).then(()=>{if(app.active===id){renderLog();toBottom()}}));}
}
async function loadOlder(){
  const id=app.active,W=win[id];if(!W.loaded||!W.hasMore||W.loading)return;
  const firstSaved=W.msgs.find(m=>m.seq!=null);if(!firstSaved){W.hasMore=false;return}
  W.loading=true;renderLog();const h0=log.scrollHeight,t0=log.scrollTop;
  try{
    const rows=await store.before(id,firstSaved.seq,PAGE);
    if(app.active!==id||win[id]!==W){W.loading=false;return}
    W.msgs=[...rows,...W.msgs];W.hasMore=rows.length===PAGE;
  }catch(e){fail("read:"+id,`${C[id].short}較早的紀錄讀取失敗`,e,async()=>{})}
  W.loading=false;
  if(app.active===id){renderLog();log.scrollTop=t0+(log.scrollHeight-h0)}
}

/* ---- 聊天流程（與回覆來源、儲存方式無關） ---- */
function addLocal(id,m){if(win[id].loaded)win[id].msgs.push(m);lastMsg[id]=m}
function setTyping(id,v){typing[id]=v;renderHead();if(id===app.active)refresh(false);if(sheet.classList.contains("open"))renderSheet()}
function deliver(id,text,from="n",extra){
  const m={from,text,t:clock.now(),...(extra||{})};addLocal(id,m);const saved=persistMsg(id,m);
  if(id!==app.active&&from==="n"){set[id].unread++;saveSettings(id)}
  if(id===app.active)refresh(from==="n");else renderHead();if(sheet.classList.contains("open"))renderSheet();return saved}
/* 每個聊天室各自排隊，回覆一定回到發問的聊天室 */
function requestReply(id,text){
  pend[id]=(pend[id]||0)+1;const ep=epoch[id];
  queue[id]=(queue[id]||Promise.resolve()).then(()=>runReply(id,text,ep)).catch(()=>{}).then(()=>{
    if(epoch[id]!==ep)return;pend[id]--;if(!pend[id]&&typing[id])setTyping(id,false);if(MOCK_TEST)size()});
}
async function runReply(id,text,ep){
  await sleep(350);if(epoch[id]!==ep)return;
  setTyping(id,true);
  let out;
  try{const context=await buildContext(id);out=await replyProvider.reply({contactId:id,text,context})}
  catch(e){if(epoch[id]!==ep)return;typing[id]=false;deliver(id,"訊號中斷，這則訊息沒有收到回覆。","sys");return}
  if(epoch[id]!==ep)return;
  let msgs=out,choices=null;
  if(out&&!Array.isArray(out)&&typeof out==="object"){choices=out.choices;msgs=out.messages}
  msgs=(Array.isArray(msgs)?msgs:[msgs]).map(String).filter(m=>m.trim());
  choices=Array.isArray(choices)?choices.map(String).filter(c=>c.trim()).slice(0,3):null;
  for(let i=0;i<msgs.length;i++){
    if(i>0){setTyping(id,true);await sleep(npcPause(msgs[i]));if(epoch[id]!==ep)return}
    typing[id]=false;deliver(id,msgs[i]);
  }
  if(choices&&choices.length&&pend[id]<=1){set[id].choices=choices;saveSettings(id);if(id===app.active)refresh(false)}
}

const EXPORT_FORMAT="nightline-holo-chat";
async function buildExport(){
  const out={format:EXPORT_FORMAT,version:1,exportedAt:new Date().toISOString(),active:app.active,contacts:{}};
  for(const id of ORDER){const msgs=await store.dumpContact(id);
    out.contacts[id]={name:C[id].name,settings:{mode:set[id].mode,draft:set[id].draft},messages:msgs.map(cleanMsg)}}
  return out;
}
async function exportAll(){
  try{
    const data=await buildExport(),n=ORDER.reduce((a,id)=>a+data.contacts[id].messages.length,0);
    const d=new Date(),name=`nightline-holo-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.json`;
    const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    if(!failures.length&&!fatalErr)renderSbar(`已匯出 ${n} 則訊息（${name}）`);
  }catch(e){fail("export","匯出失敗",e,exportAll)}
}
function parseImport(text){
  let data;try{data=JSON.parse(text)}catch(e){throw new Error("檔案不是有效的 JSON")}
  if(!data||data.format!==EXPORT_FORMAT||typeof data.contacts!=="object")throw new Error("這不是 NIGHTLINE 匯出的聊天紀錄檔");
  if(data.version!==1)throw new Error(`不支援的檔案版本：${data.version}`);
  const plan=[],skipped=[];let total=0;
  for(const [id,c] of Object.entries(data.contacts)){
    if(!C[id]){skipped.push(id);continue}
    if(!c||!Array.isArray(c.messages))throw new Error(`${C[id].short}的資料格式不正確`);
    const bad=c.messages.findIndex(m=>!validMsg(m));
    if(bad>=0)throw new Error(`${C[id].short}的第 ${bad+1} 則訊息格式不正確`);
    total+=c.messages.length;plan.push({id,messages:c.messages});
  }
  return {plan,total,skipped};
}
$("imp").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  let parsed;try{parsed=parseImport(await f.text())}catch(err){renderSbar("無法匯入："+why(err),true);return}
  const who=parsed.plan.map(p=>C[p.id].short).join("、")||"（沒有可匯入的角色）";
  openDialog("匯入聊天紀錄？",`檔案「${f.name}」共有 ${parsed.total} 則訊息（${who}）。會與現有紀錄合併並依時間排序，重複的訊息會略過，不會刪除任何現有紀錄。`,"匯入",()=>runImport(parsed));
});
async function runImport(parsed){
  try{
    const plan=parsed.plan.map(p=>({...p,settings:{...set[p.id],seeded:true}}));
    const res=await store.mergeContacts(plan);
    for(const p of parsed.plan){set[p.id].seeded=true;win[p.id]={msgs:[],hasMore:false,loading:false,loaded:false};
      const last=await store.latest(p.id,1);lastMsg[p.id]=last[0]||null}
    await openRoom(app.active);renderLog();toBottom();renderHead();if(sheet.classList.contains("open"))renderSheet();
    const added=res.reduce((a,r)=>a+r.added,0),dup=res.reduce((a,r)=>a+r.skipped,0);
    renderSbar(`已匯入 ${added} 則訊息${dup?`，略過重複 ${dup} 則`:""}${parsed.skipped.length?`，略過不認得的角色 ${parsed.skipped.length} 個`:""}`);
  }catch(err){fail("import","匯入的紀錄沒有存進本機，現有紀錄未變動",err,()=>runImport(parsed))}
}

    <dt>故事時間線</dt><dd><select id="dbgTl">${Object.entries(st.timelines||{}).map(([k,v])=>`<option value="${esc(k)}"${set.judy.timeline===k?" selected":""}>${esc(v)}</option>`).join("")}</select></dd>
    ${dyn&&dyn.life!=="not_available"?row("地點",dyn.current_location_label)+row("活動",`${dyn.current_activity_label}（${dyn.activity_started_at} → 約 ${dyn.estimated_activity_end}）`)+row("情緒",dyn.current_mood)+row("暫時身體狀態",dyn.physical_state):""}</dl>
    <div class="dbtn"><button data-dbg="1">+1 小時</button><button data-dbg="6">+6 小時</button><button data-dbg="24">+1 天</button><button data-dbg="168">+7 天</button><button data-dbg="real">回到實際時間</button><button data-dbg="sync">立即同步</button></div>
    <div class="dbtn"><input type="datetime-local" id="dbgT" value="${local}"><button data-dbg="set">設定模擬時間</button></div></section>
    <section><h3>近期生活事件</h3><ol class="dbev">${st.events.slice().reverse().map(e=>`<li><b>${esc(e.status)}</b> ${esc(e.name)}</li>`).join("")}</ol></section>
    <section><h3>主動訊息觸發紀錄</h3><ol class="dbev">${st.proactiveLog.map(x=>`<li><b>${esc(x.trigger)}</b>（${esc(x.phase)}）<span>${esc(x.result)}</span></li>`).join("")||"<li>尚無</li>"}</ol></section>
    <section><h3>送入 AI 的 Dynamic Context</h3><pre>${esc(JSON.stringify(dyn,null,2))}</pre></section>`
    :`<section><p class="dbnote">後端未開啟開發模式，或連線失敗。</p></section>`):""}`;
}
async function dbgState(){try{return await api(`/api/debug/state?contactId=judy&tz=${encodeURIComponent(tzName())}&relationship=${set.judy.mode}&timeline=${set.judy.timeline}`)}catch(e){return null}}

/* ============================================================
   7. 啟動：開資料庫 → 遷移舊資料 → 讀設定 → 補初始對話 → 開聊天室
   ============================================================ */
async function boot(){
  renderHead();size();
  store=IndexedDBStore();
  try{await store.open();store.onlost=e=>{fatalErr=e;renderSbar()}}
  catch(e){fatalErr=e;store=MemoryStore();await store.open()}
  try{const r=MOCK_TEST?{status:"skipped"}:await migrateLegacy(store);if(r.status==="migrated")console.info("[NIGHTLINE] 已從 localStorage 遷移",r.result)}
  catch(e){fail("migrate","舊版紀錄還沒有搬進新資料庫，原資料仍完整保留",e,async()=>{await migrateLegacy(store);location.reload()})}
  try{if(!MOCK_TEST)await applySeedUpdates(store)}catch(e){fail("seedtext","開場台詞更新沒有完成（不影響其他紀錄）",e,()=>applySeedUpdates(store))}
  try{
    const a=await store.getMeta("app");if(a&&C[a.active])app.active=a.active;
    for(const id of ORDER){const s=await store.getSettings(id);if(s)set[id]={...set[id],...s,id}}
    for(const id of ORDER){
      if(!set[id].seeded){
        if(await store.count(id)===0){const now=clock.now();await store.addMessages(id,(MOCK_TEST&&id==="judy"?[]:C[id].seed).map(([m,f,t])=>({from:f,text:t,t:now+m*60000})))}
        set[id].seeded=true;await store.putSettings({...set[id]});
      }
      const last=await store.latest(id,1);lastMsg[id]=last[0]||null;
    }
  }catch(e){fail("boot","初始資料讀取失敗",e,()=>location.reload())}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
  if(MOCK_TEST){app.active="judy";set.judy.mode="lover";set.judy.choices=null}
  await openRoom(app.active);
  ready=true;renderHead();renderLog();ta.value=set[app.active].draft||"";size();toBottom();
  if(fatalErr)renderSbar();
}
async function restartMock(){
  if(!MOCK_TEST||pend.judy||testSending)return;
  await store.clearContact("judy",{...set.judy,seeded:false,draft:"",choices:null});location.reload();
}
const readyP=boot().then(async()=>{
  if(MOCK_TEST){
    testSending=true;size();
    try{
      const initial=activeScene.turns[0],saved=await store.dumpContact("judy");
      if(initial.speaker==="judy"&&saved.length<=initial.messages.length&&saved.every((m,i)=>m.from==="n"&&m.text===initial.messages[i])){
        for(let i=saved.length;i<initial.messages.length;i++){setTyping("judy",true);await sleep(npcPause(initial.messages[i]));await deliver("judy",initial.messages[i])}
        setTyping("judy",false);
      }
      const history=(await buildContext("judy")).recent;
      if(!history.length&&initial.speaker==="V")set.judy.choices=[initial.messages[0]];
      else{const step=approvedMock(history);if(step?.awaitingV)set.judy.choices=step.choices}
      await saveSettings("judy");renderLog();
    }finally{testSending=false;size()}
  }
  await syncBackend("on_open");
  setInterval(()=>syncBackend("while_open"),60*1000);       /* 後端依實際時間差推進，不依賴計時器準時 */
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncBackend("while_open")});
  if(!MOCK_TEST&&location.hash==="#debug")renderDebug();
});
window.addEventListener("hashchange",()=>{if(!MOCK_TEST&&location.hash==="#debug")renderDebug();else{const d=$("dbg");if(d)d.remove()}});
/* 開發與測試用：在主控台可用 NIGHTLINE.store 檢查資料 */
window.NIGHTLINE={get store(){return store},ready:readyP,buildExport,buildContext,get settings(){return set},
  get provider(){return replyProvider.name},syncBackend};
}
